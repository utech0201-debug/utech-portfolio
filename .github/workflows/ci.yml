name: Portfolio CI

on:
  push:
    branches:
      - upgrade/portfolio-foundation
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: utech0201-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile
        run: npm install --package-lock-only

      - name: Commit lockfile updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/portfolio-foundation'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lockfile"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
